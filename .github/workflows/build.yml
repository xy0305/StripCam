name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -workspace AngelLive.xcworkspace \
            -scheme AngelLive \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify plugin bundled
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/AngelLive.app"
          find "$APP" -iname '*stripchat*' -o -iname 'lp_plugin_*' 2>/dev/null | head -20

  package:
    name: Package unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Archive (unsigned, device)
        run: |
          xcodebuild archive \
            -workspace AngelLive.xcworkspace \
            -scheme AngelLive \
            -destination 'generic/platform=iOS' \
            -archivePath build/StripCam.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          APP="build/StripCam.xcarchive/Products/Applications/AngelLive.app"
          ls -la "$APP" | head -5
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr StripCam-unsigned.ipa Payload
          ls -lh StripCam-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StripCam-unsigned
          path: StripCam-unsigned.ipa
