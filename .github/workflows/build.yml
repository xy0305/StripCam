name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build
        run: |
          xcodebuild build \
            -project StripCam.xcodeproj \
            -scheme StripCam \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

  package:
    name: Package unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive (unsigned, device)
        run: |
          xcodebuild archive \
            -project StripCam.xcodeproj \
            -scheme StripCam \
            -destination 'generic/platform=iOS' \
            -archivePath build/StripCam.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          APP="build/StripCam.xcarchive/Products/Applications/StripCam.app"
          ls -la "$APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr StripCam-unsigned.ipa Payload
          ls -lh StripCam-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StripCam-unsigned
          path: StripCam-unsigned.ipa
