name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Selecting $LATEST"
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -workspace AngelLive.xcworkspace \
            -scheme AngelLive \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify plugin bundled
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/AngelLive.app"
          find "$APP" -iname '*stripchat*' -o -iname 'lp_plugin_*' 2>/dev/null | head -20

  package:
    name: Package unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Archive (unsigned, device)
        run: |
          xcodebuild archive \
            -workspace AngelLive.xcworkspace \
            -scheme AngelLive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/StripCam.xcarchive \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        run: |
          APP="build/StripCam.xcarchive/Products/Applications/AngelLive.app"
          test -d "$APP"
          echo "=== App payload ==="
          ls -la "$APP" | head -30
          echo "=== Frameworks ==="
          ls -la "$APP/Frameworks" 2>/dev/null || echo "WARNING: no Frameworks directory"
          # 侧载工具会读取这个文件，把原版 iCloud/推送/组播 entitlements 签进包里，
          # 安装后一打开就被系统 SIGKILL。
          rm -f "$APP/archived-expanded-entitlements.xcent"
          rm -f "$APP/embedded.mobileprovision"
          rm -rf Payload StripCam-unsigned.ipa
          mkdir -p Payload
          ditto "$APP" "Payload/AngelLive.app"
          zip -qr StripCam-unsigned.ipa Payload
          python3 -c "import zipfile; z=zipfile.ZipFile('StripCam-unsigned.ipa'); names=z.namelist(); print('entries', len(names)); print('first', names[:8]); assert any(n.startswith('Payload/') for n in names), 'IPA missing Payload/ root'"
          ls -lh StripCam-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StripCam-unsigned
          path: StripCam-unsigned.ipa
